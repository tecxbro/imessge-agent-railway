name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: imessage_agent_test
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d imessage_agent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:security
      - run: npm run test:integration
        env:
          POSTGRES_PIPELINE_TEST_DATABASE_URL: postgresql://agent:test-only-password@127.0.0.1:5432/imessage_agent_test
      - run: npm run test:chaos
      - run: npm run build
      - run: npm run railway:validate
      - run: npx vitest run test/unit/provider-cleanup.test.ts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate Railway configuration against the official schema
        run: |
          python -m pip install check-jsonschema==0.38.0
          check-jsonschema --schemafile https://railway.com/railway.schema.json railway.json
